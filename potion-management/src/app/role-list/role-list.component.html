<div class="page">
  <h1 class="page-title">Roles</h1>

  <p *ngIf="loading" class="msg">Loading...</p>
  <p *ngIf="error" class="msg error">{{ error }}</p>

  <table *ngIf="!loading && !error && roles.length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Icon</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of roles" [class.inactive]="!r.active">
        <td>{{ r.name }}</td>
        <td><i class="bi {{ iconClass(r.roleIcon) }}"></i></td>
        <td>
          <span *ngIf="r.active" class="badge active-badge">Active</span>
          <span *ngIf="!r.active" class="badge inactive-badge">Inactive</span>
        </td>
        <td class="actions">
          <button class="btn btn-sm btn-outline" (click)="openUpdateModal(r)">Update</button>
          <button *ngIf="isAdmin && r.active" class="btn btn-sm btn-danger" (click)="deactivateRole(r)">Deactivate</button>
          <button *ngIf="isAdmin && !r.active" class="btn btn-sm btn-success" (click)="activateRole(r)">Activate</button>
        </td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!loading && !error && !roles.length" class="msg">No roles found.</p>
</div>

<div *ngIf="showModal" class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <h2>Update Role</h2>
    <p *ngIf="modalError" class="msg error">{{ modalError }}</p>

    <label>Name</label>
    <input type="text" [(ngModel)]="form.name" />

    <label>Icon <span class="hint">(Bootstrap icon name, e.g. shield-fill)</span></label>
    <input type="text" [(ngModel)]="form.roleIcon" />
    <span class="icon-preview" *ngIf="form.roleIcon">
      <i class="bi bi-{{ form.roleIcon }}"></i> bi-{{ form.roleIcon }}
    </span>

    <div class="modal-actions">
      <button class="btn" (click)="closeModal()">Cancel</button>
      <button class="btn btn-primary" (click)="saveRole()" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save' }}
      </button>
    </div>
  </div>
</div>
